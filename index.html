<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apk Premium | Apk Premium Cepat & Murah</title>

    <meta name="description" content="Apk Premium Cepat & Murah untuk berbagai aplikasi premium populer.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================= -->
    <!-- LOADING SCREEN -->
    <!-- ========================================= -->
    <div class="loading-screen" id="loadingScreen" aria-label="Loading Screen">
        <div class="loading-content">
            <h1 class="loading-logo">Apk Premium Jayy</h1>
        </div>
    </div>

    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->
    <header class="header">
        <div class="container">

            <div class="header-content">
                <h1 class="site-title">
                    Apk Premium
                </h1>

                <p class="site-subtitle">
                    Apk Premium Cepat &amp; Murah
                </p>
            </div>

        </div>
    </header>

    <!-- ========================================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================================= -->
    <main class="main-content">

        <!-- APK LIST -->
        <section class="apk-section" aria-labelledby="apkSectionTitle">

            <div class="container">

                <h2 id="apkSectionTitle" class="section-title">
                    Daftar Aplikasi Premium
                </h2>

                <!-- GRID APK -->
                <div class="apk-grid">

                    <!-- APK CARD : ALIGHT MOTION -->
                    <article
                        class="apk-card"
                        data-apk-name="Alight Motion"
                    >
                        <figure class="apk-image-wrapper">
                            <img
                                src="assets/edit.png"
                                alt="Alight Motion Premium"
                                class="apk-image"
                            >
                        </figure>

                        <div class="apk-content">
                            <h3 class="apk-title">
                                Alight Motion
                            </h3>
                        </div>
                    </article>

                    <!-- APK CARD : WINK -->
                    <article
                        class="apk-card"
                        data-apk-name="WINK"
                    >
                        <figure class="apk-image-wrapper">
                            <img
                                src="assets/wink.png"
                                alt="WINK Premium"
                                class="apk-image"
                            >
                        </figure>

                        <div class="apk-content">
                            <h3 class="apk-title">
                                WINK
                            </h3>
                        </div>
                    </article>

                </div>

            </div>

        </section>

    </main>

    <!-- ========================================= -->
    <!-- TOAST CONTAINER -->
    <!-- ========================================= -->
    <div
        id="toastContainer"
        class="toast-container"
        aria-live="polite"
        aria-atomic="true"
    ></div>

    <!-- ========================================= -->
    <!-- MAIN JAVASCRIPT -->
    <!-- ========================================= -->
    <script src="script.js"></script>

</body>
</html>
